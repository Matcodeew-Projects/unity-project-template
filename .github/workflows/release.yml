name: Unity Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_NAME: UnityProject

jobs:
  release:
    name: Build & Release Windows
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────
      # Repository
      # ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # ─────────────────────────────────────────────
      # Unity Library Cache
      # ─────────────────────────────────────────────
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Release-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Release-StandaloneWindows64-
            Library-StandaloneWindows64-
            Library-

      # ─────────────────────────────────────────────
      # Unity Build
      # ─────────────────────────────────────────────
      - name: Build Windows64
        id: build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          targetPlatform: StandaloneWindows64
          buildsPath: build
          buildName: ${{ env.PROJECT_NAME }}
          versioning: Tag

      # ─────────────────────────────────────────────
      # Package
      # ─────────────────────────────────────────────
      - name: Create release archive
        run: |
          cd build/StandaloneWindows64
          zip -r "../../${{ env.PROJECT_NAME }}_${{ github.ref_name }}_Windows64.zip" .

      # ─────────────────────────────────────────────
      # GitHub Release
      # ─────────────────────────────────────────────
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "${{ env.PROJECT_NAME }}_${{ github.ref_name }}_Windows64.zip" \
            --title "${{ env.PROJECT_NAME }} ${{ github.ref_name }}" \
            --generate-notes