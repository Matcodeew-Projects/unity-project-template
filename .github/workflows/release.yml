name: Unity Release

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_NAME: UnityProject

jobs:

  # ─────────────────────────────────────────────
  # Compute Version
  # ─────────────────────────────────────────────
  version:
    name: Compute Version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.compute.outputs.version }}
      unity_version: ${{ steps.compute.outputs.unity_version }}
      previous_tag: ${{ steps.compute.outputs.previous_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: compute
        shell: bash
        run: |
          git fetch --tags --force

          LAST_TAG=$(git tag \
            --list 'v[0-9]*.[0-9]*.[0-9]*' \
            --sort=-v:refname | head -n 1)

          echo "previous_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"

          if [ -z "$LAST_TAG" ]; then
            MAJOR=0
            MINOR=0
            PATCH=1
          else
            VERSION="${LAST_TAG#v}"

            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            PATCH=$((PATCH + 1))
          fi

          VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          UNITY_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "unity_version=$UNITY_VERSION" >> "$GITHUB_OUTPUT"

          echo "Previous version: $LAST_TAG"
          echo "Release version: $VERSION"


  # ─────────────────────────────────────────────
  # Generate Devlog
  # ─────────────────────────────────────────────
  devlog:
    name: Generate Devlog
    needs: version

    uses: ./.github/workflows/devlog.yml

    with:
      version: ${{ needs.version.outputs.version }}
      previous_tag: ${{ needs.version.outputs.previous_tag }}


  # ─────────────────────────────────────────────
  # Unity Build
  # ─────────────────────────────────────────────
  build:
    name: Build Windows64
    runs-on: ubuntu-latest
    needs: version

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Release-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Release-StandaloneWindows64-
            Library-StandaloneWindows64-
            Library-

      - name: Build Windows64
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          targetPlatform: StandaloneWindows64
          buildsPath: build
          buildName: ${{ env.PROJECT_NAME }}

          versioning: Custom
          version: ${{ needs.version.outputs.unity_version }}

      - name: Create ZIP
        shell: bash
        run: |
          cd build/StandaloneWindows64

          zip -r \
            "../../${{ env.PROJECT_NAME }}_${{ needs.version.outputs.version }}_Windows64.zip" \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ needs.version.outputs.version }}-Windows64
          path: ${{ env.PROJECT_NAME }}_${{ needs.version.outputs.version }}_Windows64.zip
          retention-days: 7


  # ─────────────────────────────────────────────
  # GitHub Release
  # ─────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    needs:
      - version
      - build
      - devlog

    steps:

      # ─────────────────────────────────────────
      # Download Build
      # ─────────────────────────────────────────
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ needs.version.outputs.version }}-Windows64
          path: artifacts


      # ─────────────────────────────────────────
      # Download Devlog
      # ─────────────────────────────────────────
      - name: Download devlog
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.devlog.outputs.artifact_name }}
          path: devlog


      # ─────────────────────────────────────────
      # Create Release + Tag
      # ─────────────────────────────────────────
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          gh release create "${{ needs.version.outputs.version }}" \
            artifacts/*.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "${{ env.PROJECT_NAME }} ${{ needs.version.outputs.version }}" \
            --notes-file devlog/DEVLOG.md
